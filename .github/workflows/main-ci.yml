name: Main CI

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  shared-ci:
    uses: kurkle/configs/.github/workflows/shared-ci.yml@v1
    with:
      install-command: npm clean-install --ignore-scripts && npx playwright install chromium firefox
      # The unit tests write coverage/unit/lcov.info and the browser tests
      # coverage/browser/lcov.info. The wildcard keeps those directories in the
      # artifact (a single plain path is stored as a bare lcov.info), so the
      # Sonar job finds the files at the same paths after download.
      coverage-paths: coverage/*/lcov.info
      # Playwright's browsers are headless; the shared xvfb wrapper is not needed.
      browser-tests: false
      run-audit-signatures: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
