name: Main CI

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  shared-ci:
    uses: kurkle/configs/.github/workflows/shared-ci.yml@v1
    with:
      # No test produces coverage yet. An empty value skips both the upload
      # and the Sonar job's download, which would fail on a missing artifact.
      coverage-paths: ''
      # There are no browser tests, so the shared xvfb wrapper is not needed.
      browser-tests: false
      run-audit-signatures: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
